<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pageLeftGradMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e7e5e4" />
      <stop offset="70%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#d6d3d1" />
    </linearGradient>
    <linearGradient id="pageRightGradMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6d3d1" />
      <stop offset="30%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#e7e5e4" />
    </linearGradient>
    <linearGradient id="ribbonGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="leatherCoverGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#271005" />
    </linearGradient>
    <radialGradient id="divineGlowMask" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="subtleShadowMask" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon (no border radius) -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe-zone scaled group (scaled to ~78% so Android never clips anything) -->
  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)">
    <!-- Subtle Divine Ambient Radiance behind Open Bible -->
    <circle cx="256" cy="245" r="180" fill="url(#divineGlowMask)" />

    <!-- The Open Bible Container with Shadow -->
    <g filter="url(#subtleShadowMask)">
      <!-- Outer Leather Cover -->
      <path d="M 68 335 C 130 350, 210 338, 256 352 C 302 338, 382 350, 444 335 C 448 334, 452 338, 450 342 L 442 368 C 382 384, 302 372, 256 386 C 210 372, 130 384, 70 368 L 62 342 C 60 338, 64 334, 68 335 Z" fill="url(#leatherCoverGradMask)" stroke="#78350f" stroke-width="2" />
      <path d="M 64 165 C 130 148, 210 162, 256 180 C 302 162, 382 148, 448 165 L 444 335 C 382 350, 302 338, 256 352 C 210 338, 130 350, 68 335 Z" fill="#291408" opacity="0.9" />

      <!-- Gilded Book Edges (Block of Pages) -->
      <path d="M 74 340 C 135 354, 210 343, 256 357 C 302 343, 377 354, 438 340 L 442 355 C 380 370, 304 358, 256 372 C 208 358, 132 370, 70 355 Z" fill="url(#goldGradMask)" />

      <!-- Left Open Page -->
      <path d="M 256 182 C 205 160, 132 150, 76 168 C 72 169, 70 173, 70 177 L 76 342 C 130 326, 206 336, 256 358 Z" fill="url(#pageLeftGradMask)" stroke="#e7e5e4" stroke-width="1.5" />

      <!-- Right Open Page -->
      <path d="M 256 182 C 307 160, 380 150, 436 168 C 440 169, 442 173, 442 177 L 436 342 C 382 326, 306 336, 256 358 Z" fill="url(#pageRightGradMask)" stroke="#e7e5e4" stroke-width="1.5" />

      <!-- Center Spine Crease -->
      <path d="M 251 181 Q 256 183 261 181 L 261 359 Q 256 360 251 359 Z" fill="#a8a29e" opacity="0.55" />
      <line x1="256" y1="181" x2="256" y2="359" stroke="#78716c" stroke-width="2" opacity="0.7" />

      <!-- Left Page Subtle Scripture Lines -->
      <g stroke="#a8a29e" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
        <line x1="108" y1="195" x2="162" y2="192" />
        <line x1="108" y1="210" x2="164" y2="207" />
        <line x1="108" y1="225" x2="160" y2="222" />
        <line x1="108" y1="240" x2="165" y2="237" />
        <line x1="108" y1="255" x2="158" y2="252" />
        <line x1="108" y1="270" x2="163" y2="267" />
        <line x1="108" y1="285" x2="155" y2="282" />
        <line x1="108" y1="300" x2="162" y2="297" />
        <line x1="108" y1="315" x2="150" y2="312" />

        <line x1="184" y1="191" x2="238" y2="194" />
        <line x1="184" y1="206" x2="238" y2="209" />
        <line x1="184" y1="221" x2="235" y2="224" />
        <line x1="184" y1="236" x2="238" y2="239" />
        <line x1="184" y1="251" x2="232" y2="254" />
        <line x1="184" y1="266" x2="238" y2="269" />
        <line x1="184" y1="281" x2="234" y2="284" />
        <line x1="184" y1="296" x2="238" y2="299" />
        <line x1="184" y1="311" x2="230" y2="314" />
      </g>

      <!-- Right Page Subtle Scripture Lines -->
      <g stroke="#a8a29e" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
        <line x1="274" y1="194" x2="328" y2="191" />
        <line x1="274" y1="209" x2="328" y2="206" />
        <line x1="274" y1="224" x2="325" y2="221" />
        <line x1="274" y1="239" x2="328" y2="236" />
        <line x1="274" y1="254" x2="322" y2="251" />
        <line x1="274" y1="269" x2="328" y2="266" />
        <line x1="274" y1="284" x2="324" y2="281" />
        <line x1="274" y1="299" x2="328" y2="296" />
        <line x1="274" y1="314" x2="320" y2="311" />

        <line x1="348" y1="192" x2="404" y2="195" />
        <line x1="348" y1="207" x2="404" y2="210" />
        <line x1="348" y1="222" x2="400" y2="225" />
        <line x1="348" y1="237" x2="404" y2="240" />
        <line x1="348" y1="252" x2="398" y2="255" />
        <line x1="348" y1="267" x2="404" y2="270" />
        <line x1="348" y1="282" x2="396" y2="285" />
        <line x1="348" y1="297" x2="404" y2="300" />
        <line x1="348" y1="312" x2="392" y2="315" />
      </g>

      <!-- Silk Bookmark Ribbon -->
      <path d="M 252 178 C 254 220, 240 290, 244 382 L 256 368 L 268 382 C 264 290, 258 220, 260 178 Z" fill="url(#ribbonGradMask)" />
      <path d="M 244 382 L 256 368 L 268 382 L 268 387 L 256 373 L 244 387 Z" fill="url(#goldGradMask)" opacity="0.9" />

      <!-- Small Golden Latin Cross at Top Center of Spire -->
      <g transform="translate(256, 128) scale(0.9)">
        <circle cx="0" cy="0" r="28" fill="#18181b" stroke="url(#goldGradMask)" stroke-width="2" />
        <line x1="0" y1="-22" x2="0" y2="-17" stroke="url(#goldGradMask)" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="22" x2="0" y2="17" stroke="url(#goldGradMask)" stroke-width="2" stroke-linecap="round" />
        <line x1="-22" y1="0" x2="-17" y2="0" stroke="url(#goldGradMask)" stroke-width="2" stroke-linecap="round" />
        <line x1="22" y1="0" x2="17" y2="0" stroke="url(#goldGradMask)" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="-12" x2="0" y2="12" stroke="url(#goldGradMask)" stroke-width="3" stroke-linecap="round" />
        <line x1="-8" y1="-4" x2="8" y2="-4" stroke="url(#goldGradMask)" stroke-width="3" stroke-linecap="round" />
      </g>
    </g>

    <!-- Golden Text Label at Bottom: BÍBLIA TEOLÓGICA -->
    <text x="256" y="446" font-family="'Cinzel', 'Times New Roman', serif" font-size="25" font-weight="700" letter-spacing="4" fill="url(#goldGradMask)" text-anchor="middle">
      BÍBLIA TEOLÓGICA
    </text>
    <text x="256" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#a8a29e" text-anchor="middle">
      CRONOS &amp; CÂNON
    </text>
  </g>
</svg>
